name: Release (manual)

# Builds distributions on demand. Publishing is intentionally NOT automated here: add a
# PyPI trusted-publishing step only after the package name and ownership are confirmed.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - run: pip install build && python -m build
      - uses: actions/upload-artifact@v4
        with: {name: dist, path: dist/}

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev,app]"
      - name: Lint
        run: ruff check src tests examples experiments benchmarks
      - name: Type check
        run: mypy
      - name: Tests
        run: pytest -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install build
      - run: python -m build
      - name: Install the built wheel into a clean environment and run a CLI example
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          cd /tmp
          /tmp/clean/bin/calibcheck version
          /tmp/clean/bin/calibcheck example ex.csv
          /tmp/clean/bin/calibcheck report ex.csv --prob p_model --id row_id --group channel --out rep --quiet
          test -f rep/report.html
          grep -q '"complete": true' rep/export_manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
